<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YSRTUBE - Modern Video Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .snap-y-mandatory { scroll-snap-type: y mandatory; }
    .snap-start { scroll-snap-align: start; }
  </style>
</head>
<body class="bg-gray-950 text-white font-sans antialiased min-h-screen flex flex-col relative pb-16 sm:pb-0">

  <!-- Header Navigasi Utama -->
  <header class="sticky top-0 z-40 bg-gray-900/90 backdrop-blur border-b border-gray-800 px-4 py-3 flex items-center justify-between gap-2">
    <!-- Logo YSRTUBE -->
    <div class="flex items-center gap-2 cursor-pointer" onclick="switchMode('youtube'); goHomeWithMiniPlayer();">
      <div class="bg-red-600 text-white p-2 rounded-xl flex items-center justify-center font-bold shadow-lg shadow-red-600/30">
        <i class="fa-solid fa-play text-lg"></i>
      </div>
      <span class="text-xl font-black tracking-wider bg-gradient-to-r from-red-500 to-red-300 bg-clip-text text-transparent">YSRTUBE</span>
    </div>

    <!-- Live Search Bar -->
    <div class="flex-1 max-w-xl mx-2">
      <div class="relative">
        <input id="searchInput" type="text" placeholder="Cari video & Shorts YouTube..." 
          class="w-full bg-gray-800 border border-gray-700 rounded-full py-2 pl-4 pr-10 text-sm focus:outline-none focus:border-red-500 transition"
          onkeypress="if(event.key==='Enter') searchVideos()">
        <button onclick="searchVideos()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
    </div>

    <!-- Status Server -->
    <div class="hidden sm:flex items-center gap-2 text-xs text-gray-400 bg-gray-800/80 px-3 py-1.5 rounded-full border border-gray-700">
      <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
      <span>Live Server Sync</span>
    </div>
  </header>

  <!-- Mode Switcher Tabs -->
  <div class="bg-gray-900 border-b border-gray-800 px-4 py-2 flex justify-center gap-4 text-sm font-bold sticky top-[61px] z-30">
    <button id="btnTabYoutube" onclick="switchMode('youtube')" class="px-5 py-1.5 rounded-full bg-red-600 text-white transition flex items-center gap-2 shadow-lg shadow-red-600/20">
      <i class="fa-solid fa-tv"></i> Mode YouTube
    </button>
    <button id="btnTabShorts" onclick="switchMode('shorts')" class="px-5 py-1.5 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 transition flex items-center gap-2">
      <i class="fa-solid fa-bolt text-red-500"></i> Mode Shorts
    </button>
  </div>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-1 flex flex-col overflow-hidden">
    
    <!-- YOUTUBE MODE VIEW -->
    <div id="youtubeView" class="flex-1 overflow-y-auto p-4 max-w-7xl mx-auto w-full">
      
      <!-- Category Tags -->
      <div id="categoryTags" class="flex gap-2 overflow-x-auto pb-4 no-scrollbar text-xs font-medium">
        <button onclick="filterCategory('Semua')" class="px-4 py-2 rounded-xl bg-white text-black font-semibold whitespace-nowrap shadow">Semua</button>
        <button onclick="filterCategory('Gaming')" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 whitespace-nowrap">Gaming</button>
        <button onclick="filterCategory('Tech')" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 whitespace-nowrap">Tech</button>
        <button onclick="filterCategory('Musik')" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 whitespace-nowrap">Musik</button>
        <button onclick="filterCategory('Anime')" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 whitespace-nowrap">Anime</button>
        <button onclick="filterCategory('Edukasi')" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 whitespace-nowrap">Edukasi</button>
      </div>

      <!-- Video Grid -->
      <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <!-- Rendered via JS -->
      </div>

      <!-- Player Detail View -->
      <div id="playerDetailView" class="hidden flex-col lg:flex-row gap-6 mt-2">
        <div class="flex-1">
          <!-- Tombol Kembali dengan Fitur Mini-Player -->
          <div class="flex items-center justify-between mb-3">
            <button onclick="goHomeWithMiniPlayer()" class="text-xs text-gray-300 bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-xl border border-gray-700 flex items-center gap-2 font-semibold">
              <i class="fa-solid fa-arrow-left"></i> Kembali (Kecilkan Pemutar)
            </button>
            <button onclick="openShareModal(currentVideo.id)" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-xl flex items-center gap-1.5 font-bold shadow">
              <i class="fa-solid fa-share-nodes"></i> Bagikan
            </button>
          </div>

          <!-- Pemutar Video Utama -->
          <div class="aspect-video w-full rounded-2xl overflow-hidden bg-black shadow-2xl border border-gray-800">
            <iframe id="mainIframe" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>

          <h1 id="detailTitle" class="text-base sm:text-lg font-bold mt-3 leading-snug">Judul Video</h1>
          
          <!-- Baris Interaksi & Akses Pop-Up -->
          <div class="flex flex-wrap items-center justify-between gap-3 mt-3 pb-4 border-b border-gray-800">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-red-600 to-red-400 flex items-center justify-center font-bold text-xs uppercase shadow">Y</div>
              <div>
                <p id="detailChannel" class="font-semibold text-xs sm:text-sm">Nama Channel</p>
                <p class="text-[10px] text-gray-400">Terverifikasi YSRTUBE</p>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <!-- Tombol Pop-Up Deskripsi -->
              <button onclick="openDescModal()" class="bg-gray-800 hover:bg-gray-700 text-xs px-3 py-2 rounded-xl flex items-center gap-1.5 border border-gray-700">
                <i class="fa-solid fa-align-left text-red-500"></i> <span class="hidden sm:inline">Deskripsi</span>
              </button>

              <!-- Tombol Pop-Up Komentar Live YouTube -->
              <button onclick="openCommentModal(currentVideo.id)" class="bg-gray-800 hover:bg-gray-700 text-xs px-3 py-2 rounded-xl flex items-center gap-1.5 border border-gray-700">
                <i class="fa-solid fa-comments text-red-500"></i> Komentar
              </button>

              <!-- Tombol Like Real-Time -->
              <div class="flex items-center gap-2 bg-gray-800 rounded-xl px-3 py-2 text-xs font-semibold border border-gray-700">
                <button onclick="likeCount++; document.getElementById('likeNum').innerText=formatNum(likeCount)" class="hover:text-red-500 flex items-center gap-1">
                  <i class="fa-solid fa-thumbs-up"></i> <span id="likeNum">0</span>
                </button>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Queue Video Rekomendasi -->
        <div class="w-full lg:w-80 flex flex-col gap-3">
          <h3 class="font-bold text-sm text-gray-400">Rekomendasi Video</h3>
          <div id="relatedList" class="flex flex-col gap-3">
            <!-- Rendered via JS -->
          </div>
        </div>
      </div>
    </div>

    <!-- SHORTS MODE VIEW -->
    <div id="shortsView" class="hidden flex-1 overflow-y-auto snap-y-mandatory no-scrollbar bg-black justify-center items-center">
      <div id="shortsContainer" class="w-full max-w-md h-full mx-auto flex flex-col">
        <!-- Rendered via JS -->
      </div>
    </div>

  </main>

  <!-- ========================================================================= -->
  <!-- FLOATING MINI PLAYER (PEMUTAR MELAYANG SAAT KLIK KEMBALI)               -->
  <!-- ========================================================================= -->
  <div id="miniPlayer" class="hidden fixed bottom-4 right-4 z-50 w-72 sm:w-80 bg-gray-900 border border-gray-700 rounded-2xl overflow-hidden shadow-2xl flex flex-col">
    <div class="relative aspect-video w-full bg-black">
      <iframe id="miniIframe" class="w-full h-full pointer-events-auto" src="" frameborder="0" allow="autoplay; picture-in-picture" allowfullscreen></iframe>
      <div class="absolute top-2 right-2 flex gap-1 z-10">
        <button onclick="restoreFullPlayer()" title="Perbesar" class="bg-black/70 hover:bg-black text-white w-7 h-7 rounded-full text-xs flex items-center justify-center border border-gray-700">
          <i class="fa-solid fa-expand"></i>
        </button>
        <button onclick="closeMiniPlayer()" title="Tutup" class="bg-black/70 hover:bg-red-600 text-white w-7 h-7 rounded-full text-xs flex items-center justify-center border border-gray-700">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>
    <div class="p-2.5 bg-gray-900 flex justify-between items-center text-xs">
      <p id="miniTitle" class="font-bold truncate text-gray-200 pr-2">Judul Video</p>
      <span class="text-[10px] bg-red-600/30 text-red-400 px-2 py-0.5 rounded-full font-semibold">Mini Player</span>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- POP-UP MODAL DESKRIPSI                                                   -->
  <!-- ========================================================================= -->
  <div id="descModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-gray-900 border border-gray-800 rounded-t-2xl sm:rounded-2xl p-5 max-w-md w-full max-h-[70vh] flex flex-col shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b border-gray-800">
        <h3 class="font-bold text-sm flex items-center gap-2 text-white">
          <i class="fa-solid fa-circle-info text-red-500"></i> Deskripsi Video
        </h3>
        <button onclick="closeDescModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="modalDescContent" class="overflow-y-auto mt-3 text-xs text-gray-300 leading-relaxed whitespace-pre-line">
        Memuat deskripsi...
      </div>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- POP-UP MODAL KOMENTAR (REAL-TIME YOUTUBE COMMENTS)                      -->
  <!-- ========================================================================= -->
  <div id="commentModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-gray-900 border border-gray-800 rounded-t-2xl sm:rounded-2xl p-5 max-w-md w-full h-[75vh] flex flex-col shadow-2xl">
      <div class="flex justify-between items-center pb-3 border-b border-gray-800">
        <h3 class="font-bold text-sm flex items-center gap-2 text-white">
          <i class="fa-solid fa-comments text-red-500"></i> Komentar YouTube Live (<span id="commentCount">0</span>)
        </h3>
        <button onclick="closeCommentModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- List Komentar Asli dari YouTube -->
      <div id="modalCommentsList" class="flex-1 overflow-y-auto mt-3 space-y-3 text-xs no-scrollbar">
        <!-- Rendered via JS -->
      </div>
    </div>
  </div>

  <!-- ========================================================================= -->
  <!-- POP-UP MODAL BAGIKAN (SHARE)                                              -->
  <!-- ========================================================================= -->
  <div id="shareModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 max-w-sm w-full shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-gray-800">
        <h3 class="text-sm font-bold flex items-center gap-2 text-white">
          <i class="fa-solid fa-share-nodes text-red-500"></i> Bagikan Video
        </h3>
        <button onclick="closeShareModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p class="text-xs text-gray-400 mt-3">Salin link untuk dibagikan:</p>
      <div class="flex items-center gap-2 mt-2 bg-gray-800 p-2 rounded-xl border border-gray-700">
        <input id="shareLinkInput" type="text" readonly value="" class="bg-transparent text-xs w-full text-gray-300 focus:outline-none px-1">
        <button onclick="copyShareLink()" class="bg-red-600 hover:bg-red-700 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg flex-shrink-0">Salin</button>
      </div>
      <div class="grid grid-cols-2 gap-2 mt-4">
        <a id="waShareBtn" target="_blank" class="flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 text-white py-2 rounded-xl text-xs font-semibold">
          <i class="fa-brands fa-whatsapp text-sm"></i> WhatsApp
        </a>
        <button onclick="copyShareLink()" class="flex items-center justify-center gap-2 bg-gray-800 hover:bg-gray-700 text-gray-200 py-2 rounded-xl text-xs font-semibold border border-gray-700">
          <i class="fa-regular fa-copy"></i> Salin Link
        </button>
      </div>
    </div>
  </div>

  <script>
    // YouTube Data API Key
    const ADMIN_API_KEY = 'AIzaSyBE5hJMMd2w5BnJPeH9RqtAaAUlP3nJh_s';

    // Daftar Video Utama YSRTUBE
    let videos = [
      { id: 'y62El8ChO0Q', title: 'PLIS JANGAN DIBELI!😭 7 HP SPEK BADUT PALING LUCU DI TAHUN 2026!', channel: 'Tombol Power', category: 'Tech' },
      { id: 'Ft1ROWvjcz8', title: 'Rp5 JUTA buat barang yg isinya ga jelas... MYSTERY BOX 2026!', channel: 'GadgetIn', category: 'Tech' },
      { id: 'nWwEOtQqIRo', title: 'Aku Memulai Hidup Sebagai Penyihir Terkuat di Dunia - Episode 01 [Takarir Indonesia]', channel: 'Muse Indonesia', category: 'Anime' },
      { id: 'IYEXsQpbIOc', title: 'Genius Yang Menantang Tuhan Lewat Rahasia Alam Semesta! | Stephen Hawking', channel: 'Ardhianzy', category: 'Edukasi' },
      { id: 'TK4t9SzrWAE', title: 'HP 1 Jutaan ini Punya Spek Dewa?! Tapi... - Review Poco X3 Pro 2026', channel: 'Gizmora Labs', category: 'Tech' }
    ];

    // Daftar Shorts YSRTUBE
    let shortsList = [
      { id: 'rS3s9a0l6Gk', title: 'Shorts Epic Gaming Moment', channel: 'GameShorts' },
      { id: '9bZkp7q19f0', title: 'PSY - GANGNAM STYLE Shorts', channel: 'OfficialPSY' },
      { id: '3JZ_D3ELwOQ', title: 'Cool Tech Gadgets', channel: 'TechShorts' }
    ];

    let currentVideo = null;
    let likeCount = 1500;

    window.onload = () => {
      renderYoutubeGrid(videos);
      renderShortsList();
    };

    function formatNum(num) {
      return num > 999999 ? (num/1000000).toFixed(1) + 'M' : num > 999 ? (num/1000).toFixed(1) + 'k' : num;
    }

    function switchMode(mode) {
      const ytView = document.getElementById('youtubeView');
      const shView = document.getElementById('shortsView');
      const btnYt = document.getElementById('btnTabYoutube');
      const btnSh = document.getElementById('btnTabShorts');

      if (mode === 'youtube') {
        ytView.classList.remove('hidden');
        shView.classList.add('hidden');
        shView.classList.remove('flex');
        btnYt.className = "px-5 py-1.5 rounded-full bg-red-600 text-white transition flex items-center gap-2 shadow-lg shadow-red-600/20";
        btnSh.className = "px-5 py-1.5 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 transition flex items-center gap-2";
      } else {
        ytView.classList.add('hidden');
        shView.classList.remove('hidden');
        shView.classList.add('flex');
        btnSh.className = "px-5 py-1.5 rounded-full bg-red-600 text-white transition flex items-center gap-2 shadow-lg shadow-red-600/20";
        btnYt.className = "px-5 py-1.5 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 transition flex items-center gap-2";
      }
    }

    function renderYoutubeGrid(dataList) {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';
      document.getElementById('playerDetailView').classList.add('hidden');
      document.getElementById('categoryTags').classList.remove('hidden');
      grid.classList.remove('hidden');

      dataList.forEach(vid => {
        const card = document.createElement('div');
        card.className = "bg-gray-900 rounded-2xl overflow-hidden border border-gray-800 hover:border-gray-700 transition cursor-pointer flex flex-col group shadow-lg";
        card.onclick = () => openVideoPlayer(vid);
        card.innerHTML = `
          <div class="relative aspect-video bg-gray-800 overflow-hidden">
            <img src="https://img.youtube.com/vi/${vid.id}/hqdefault.jpg" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
            <span class="absolute bottom-2 right-2 bg-black/80 text-[10px] font-bold px-1.5 py-0.5 rounded">HD</span>
          </div>
          <div class="p-3.5 flex gap-3">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-red-600 to-red-400 flex-shrink-0 flex items-center justify-center font-bold text-xs uppercase shadow">${vid.channel[0]}</div>
            <div class="flex-1 min-w-0">
              <h4 class="text-xs font-bold text-white line-clamp-2 leading-snug">${vid.title}</h4>
              <p class="text-[11px] text-gray-400 mt-1">${vid.channel}</p>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openVideoPlayer(vid) {
      currentVideo = vid;
      closeMiniPlayer();

      document.getElementById('videoGrid').classList.add('hidden');
      document.getElementById('categoryTags').classList.add('hidden');
      const detail = document.getElementById('playerDetailView');
      detail.classList.remove('hidden');
      detail.classList.add('flex');

      document.getElementById('mainIframe').src = `https://www.youtube-nocookie.com/embed/${vid.id}?autoplay=1`;
      document.getElementById('detailTitle').innerText = vid.title;
      document.getElementById('detailChannel').innerText = vid.channel;

      // Ambil Like & Stats Asli dari YouTube Server
      fetchRealVideoStats(vid.id);

      // Render Rekomendasi
      const related = document.getElementById('relatedList');
      related.innerHTML = '';
      videos.filter(v => v.id !== vid.id).forEach(v => {
        const item = document.createElement('div');
        item.className = "flex gap-2.5 cursor-pointer bg-gray-900 p-2 rounded-xl border border-gray-800 hover:border-gray-700 transition";
        item.onclick = () => openVideoPlayer(v);
        item.innerHTML = `
          <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" class="w-28 aspect-video object-cover rounded-lg">
          <div class="min-w-0 flex-1">
            <p class="text-xs font-semibold line-clamp-2 leading-tight">${v.title}</p>
            <p class="text-[10px] text-gray-400 mt-1">${v.channel}</p>
          </div>
        `;
        related.appendChild(item);
      });
    }

    // --- FITUR FLOATING MINI PLAYER ---
    function goHomeWithMiniPlayer() {
      if (currentVideo) {
        document.getElementById('miniIframe').src = `https://www.youtube-nocookie.com/embed/${currentVideo.id}?au
