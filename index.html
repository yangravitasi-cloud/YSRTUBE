<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YSRTUBE - Video Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .snap-y-mandatory { scroll-snap-type: y mandatory; }
    .snap-start { scroll-snap-align: start; }
  </style>
</head>
<body class="bg-gray-950 text-white font-sans antialiased min-h-screen flex flex-col">

  <!-- Header Navigasi Publik -->
  <header class="sticky top-0 z-40 bg-gray-900/90 backdrop-blur border-b border-gray-800 px-4 py-3 flex items-center justify-between gap-2">
    <!-- Logo YSRTUBE -->
    <div class="flex items-center gap-2 cursor-pointer" onclick="switchMode('youtube'); resetToHome();">
      <div class="bg-red-600 text-white p-2 rounded-xl flex items-center justify-center font-bold shadow-lg shadow-red-600/30">
        <i class="fa-solid fa-play text-lg"></i>
      </div>
      <span class="text-xl font-black tracking-wider bg-gradient-to-r from-red-500 to-red-300 bg-clip-text text-transparent">YSRTUBE</span>
    </div>

    <!-- Live Search Bar -->
    <div class="flex-1 max-w-xl mx-2">
      <div class="relative">
        <input id="searchInput" type="text" placeholder="Cari video di YouTube..." 
          class="w-full bg-gray-800 border border-gray-700 rounded-full py-2 pl-4 pr-10 text-sm focus:outline-none focus:border-red-500 transition"
          onkeypress="if(event.key==='Enter') searchVideos()">
        <button onclick="searchVideos()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
    </div>

    <!-- Status Server Safe -->
    <div class="hidden sm:flex items-center gap-2 text-xs text-gray-400 bg-gray-800/80 px-3 py-1.5 rounded-full border border-gray-700">
      <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
      <span>YSR Server Active</span>
    </div>
  </header>

  <!-- Mode Switcher Tabs -->
  <div class="bg-gray-900 border-b border-gray-800 px-4 py-2 flex justify-center gap-4 text-sm font-bold">
    <button id="btnTabYoutube" onclick="switchMode('youtube')" class="px-5 py-1.5 rounded-full bg-red-600 text-white transition flex items-center gap-2 shadow-lg shadow-red-600/20">
      <i class="fa-solid fa-tv"></i> Mode YouTube
    </button>
    <button id="btnTabShorts" onclick="switchMode('shorts')" class="px-5 py-1.5 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 transition flex items-center gap-2">
      <i class="fa-solid fa-bolt text-red-500"></i> Mode Shorts
    </button>
  </div>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 flex flex-col overflow-hidden">
    
    <!-- YOUTUBE MODE VIEW -->
    <div id="youtubeView" class="flex-1 overflow-y-auto p-4 max-w-7xl mx-auto w-full">
      
      <!-- Category Tags -->
      <div id="categoryTags" class="flex gap-2 overflow-x-auto pb-4 no-scrollbar text-xs font-medium">
        <button onclick="filterCategory('Semua')" class="px-4 py-2 rounded-xl bg-white text-black font-semibold whitespace-nowrap shadow">Semua</button>
        <button onclick="filterCategory('Gaming')" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 whitespace-nowrap">Gaming</button>
        <button onclick="filterCategory('Genshin Impact')" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 whitespace-nowrap">Genshin Impact</button>
        <button onclick="filterCategory('Musik')" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 whitespace-nowrap">Musik</button>
        <button onclick="filterCategory('Tech')" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 whitespace-nowrap">Tech</button>
        <button onclick="filterCategory('Anime')" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 whitespace-nowrap">Anime</button>
        <button onclick="filterCategory('Edukasi')" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 whitespace-nowrap">Edukasi</button>
      </div>

      <!-- Video Grid -->
      <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <!-- Rendered via JS -->
      </div>

      <!-- Player Detail View -->
      <div id="playerDetailView" class="hidden flex-col lg:flex-row gap-6 mt-2">
        <div class="flex-1">
          <button onclick="resetToHome()" class="mb-3 text-xs text-gray-400 hover:text-white flex items-center gap-1 font-semibold">
            <i class="fa-solid fa-arrow-left"></i> Kembali ke Galeri
          </button>
          <div class="aspect-video w-full rounded-2xl overflow-hidden bg-black shadow-2xl border border-gray-800">
            <iframe id="mainIframe" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          <h1 id="detailTitle" class="text-lg font-bold mt-3">Judul Video</h1>
          <div class="flex flex-wrap items-center justify-between gap-4 mt-2 pb-4 border-b border-gray-800">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full bg-red-600 flex items-center justify-center font-bold text-lg">Y</div>
              <div>
                <p id="detailChannel" class="font-semibold text-sm">Nama Channel</p>
                <p class="text-xs text-gray-400">Verifikasi YSRTUBE</p>
              </div>
              <button onclick="this.innerText = this.innerText==='Subscribed'?'Subscribe':'Subscribed'; this.classList.toggle('bg-gray-800')" class="ml-2 bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-4 py-2 rounded-full transition">
                Subscribe
              </button>
            </div>
            <div class="flex items-center gap-2 bg-gray-800 rounded-full px-4 py-2 text-xs font-semibold border border-gray-700">
              <button onclick="likeCount++; document.getElementById('likeNum').innerText=likeCount" class="hover:text-red-500 flex items-center gap-1.5 transition">
                <i class="fa-solid fa-thumbs-up"></i> <span id="likeNum">1.5 rb</span>
              </button>
              <span class="text-gray-600">|</span>
              <button class="hover:text-red-500"><i class="fa-solid fa-thumbs-down"></i></button>
            </div>
          </div>
          <p id="detailDesc" class="text-xs text-gray-300 mt-3 bg-gray-900 p-3.5 rounded-xl border border-gray-800">
            Selamat datang di YSRTUBE! Nikmati pengalaman menonton video tanpa gangguan.
          </p>
        </div>
        
        <!-- Related Videos Queue -->
        <div class="w-full lg:w-80 flex flex-col gap-3">
          <h3 class="font-bold text-sm text-gray-400">Rekomendasi Lainnya</h3>
          <div id="relatedList" class="flex flex-col gap-3">
            <!-- Rendered via JS -->
          </div>
        </div>
      </div>
    </div>

    <!-- SHORTS MODE VIEW -->
    <div id="shortsView" class="hidden flex-1 overflow-y-auto snap-y-mandatory no-scrollbar bg-black justify-center items-center">
      <div id="shortsContainer" class="w-full max-w-md h-full mx-auto flex flex-col">
        <!-- Rendered via JS -->
      </div>
    </div>

  </main>

  <script>
    // YouTube Data API Key resmi yang terhubung otomatis
    const ADMIN_API_KEY = 'AIzaSyBE5hJMMd2w5BnJPeH9RqtAaAUlP3nJh_s';

    // =========================================================================
    // DAFTAR VIDEO PERMANEN ADMIN (hanya piyan yang bisa tambah/ubah kapan saja di sini)
    // =========================================================================
        let videos = [
      { id: 'y62El8ChO0Q', title: 'PLIS JANGAN DIBELI!😭 7 HP SPEK BADUT PALING LUCU DI TAHUN 2026!', channel: 'Tombol Power', category: 'Tech' },
      { id: 'Ft1ROWvjcz8', title: 'Rp5 JUTA buat barang yg isinya ga jelas... MYSTERY BOX 2026!', channel: 'GadgetIn', category: 'Tech' },
      { id: 'nWwEOtQqIRo', title: 'Aku Memulai Hidup Sebagai Penyihir Terkuat di Dunia - Episode 01 [Takarir Indonesia]', channel: 'Muse Indonesia', category: 'Anime' },
      { id: 'IYEXsQpbIOc', title: 'Genius Yang Menantang Tuhan Lewat Rahasia Alam Semesta! | Stephen Hawking', channel: 'Ardhianzy', category: 'Edukasi' },
      { id: 'TK4t9SzrWAE', title: 'HP 1 Jutaan ini Punya Spek Dewa?! Tapi... - Review Poco X3 Pro 2026', channel: 'Gizmora Labs', category: 'Tech' }
    ];
    

    // DAFTAR SHORTS PERMANEN ADMIN
    let shortsList = [
      { id: 'rS3s9a0l6Gk', title: 'Shorts Epic Gaming Moment', channel: 'GameShorts' },
      { id: '9bZkp7q19f0', title: 'PSY - GANGNAM STYLE Shorts', channel: 'OfficialPSY' },
      { id: '3JZ_D3ELwOQ', title: 'Cool Tech Gadgets', channel: 'TechShorts' }
    ];

    let currentMode = 'youtube';
    let likeCount = 1520;

    window.onload = () => {
      renderYoutubeGrid(videos);
      renderShortsList();
    };

    function switchMode(mode) {
      currentMode = mode;
      const ytView = document.getElementById('youtubeView');
      const shView = document.getElementById('shortsView');
      const btnYt = document.getElementById('btnTabYoutube');
      const btnSh = document.getElementById('btnTabShorts');

      if (mode === 'youtube') {
        ytView.classList.remove('hidden');
        shView.classList.add('hidden');
        shView.classList.remove('flex');
        btnYt.className = "px-5 py-1.5 rounded-full bg-red-600 text-white transition flex items-center gap-2 shadow-lg shadow-red-600/20";
        btnSh.className = "px-5 py-1.5 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 transition flex items-center gap-2";
      } else {
        ytView.classList.add('hidden');
        shView.classList.remove('hidden');
        shView.classList.add('flex');
        btnSh.className = "px-5 py-1.5 rounded-full bg-red-600 text-white transition flex items-center gap-2 shadow-lg shadow-red-600/20";
        btnYt.className = "px-5 py-1.5 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 transition flex items-center gap-2";
      }
    }

    function renderYoutubeGrid(dataList) {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';
      document.getElementById('playerDetailView').classList.add('hidden');
      document.getElementById('categoryTags').classList.remove('hidden');
      grid.classList.remove('hidden');

      dataList.forEach(vid => {
        const card = document.createElement('div');
        card.className = "bg-gray-900 rounded-2xl overflow-hidden border border-gray-800/80 hover:border-gray-700 transition cursor-pointer flex flex-col group shadow-lg";
        card.onclick = () => openVideoPlayer(vid);
        card.innerHTML = `
          <div class="relative aspect-video bg-gray-800 overflow-hidden">
            <img src="https://img.youtube.com/vi/${vid.id}/hqdefault.jpg" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
            <span class="absolute bottom-2 right-2 bg-black/80 text-[10px] font-bold px-1.5 py-0.5 rounded">HD</span>
          </div>
          <div class="p-3.5 flex gap-3">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-red-600 to-red-400 flex-shrink-0 flex items-center justify-center font-bold text-xs uppercase shadow">${vid.channel[0]}</div>
            <div class="flex-1 min-w-0">
              <h4 class="text-xs font-bold text-white line-clamp-2 leading-snug">${vid.title}</h4>
              <p class="text-[11px] text-gray-400 mt-1">${vid.channel}</p>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openVideoPlayer(vid) {
      document.getElementById('videoGrid').classList.add('hidden');
      document.getElementById('categoryTags').classList.add('hidden');
      const detail = document.getElementById('playerDetailView');
      detail.classList.remove('hidden');
      detail.classList.add('flex');

      document.getElementById('mainIframe').src = `https://www.youtube-nocookie.com/embed/${vid.id}?autoplay=1`;
      document.getElementById('detailTitle').innerText = vid.title;
      document.getElementById('detailChannel').innerText = vid.channel;

      const related = document.getElementById('relatedList');
      related.innerHTML = '';
      videos.filter(v => v.id !== vid.id).forEach(v => {
        const item = document.createElement('div');
        item.className = "flex gap-2.5 cursor-pointer bg-gray-900 p-2 rounded-xl border border-gray-800 hover:border-gray-700 transition";
        item.onclick = () => openVideoPlayer(v);
        item.innerHTML = `
          <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" class="w-28 aspect-video object-cover rounded-lg">
          <div class="min-w-0 flex-1">
            <p class="text-xs font-semibold line-clamp-2 leading-tight">${v.title}</p>
            <p class="text-[10px] text-gray-400 mt-1">${v.channel}</p>
          </div>
        `;
        related.appendChild(item);
      });
    }

    function resetToHome() {
      document.getElementById('mainIframe').src = '';
      renderYoutubeGrid(videos);
    }

    function renderShortsList() {
      const container = document.getElementById('shortsContainer');
      container.innerHTML = '';

      shortsList.forEach(s => {
        const shortCard = document.createElement('div');
        shortCard.className = "w-full h-full snap-start flex-shrink-0 relative bg-gray-900 flex flex-col justify-end p-4 border-b border-gray-800";
        shortCard.innerHTML = `
          <div class="absolute inset-0 z-0">
            <iframe class="w-full h-full" src="https://www.youtube-nocookie.com/embed/${s.id}?autoplay=0&loop=1" frameborder="0" allowfullscreen></iframe>
          </div>
          <div class="relative z-10 flex justify-between items-end gap-4 pointer-events-none">
            <div class="pointer-events-auto bg-black/70 backdrop-blur p-3 rounded-2xl max-w-[80%] border border-gray-800">
              <p class="font-bold text-xs text-red-400">@${s.channel}</p>
              <p class="text-xs mt-1 line-clamp-2">${s.title}</p>
            </div>
            <div class="pointer-events-auto flex flex-col gap-4 text-center text-xs font-bold">
              <button onclick="this.classList.toggle('text-red-500')" class="flex flex-col items-center gap-1 bg-black/70 p-2.5 rounded-full border border-gray-800">
                <i class="fa-solid fa-heart text-base"></i> <span class="text-[10px]">18K</span>
              </button>
              <button class="flex flex-col items-center gap-1 bg-black/70 p-2.5 rounded-full border border-gray-800">
                <i class="fa-solid fa-comment text-base"></i> <span class="text-[10px]">520</span>
              </button>
              <button class="flex flex-col items-center gap-1 bg-black/70 p-2.5 rounded-full border border-gray-800">
                <i class="fa-solid fa-share text-base"></i> <span class="text-[10px]">Bagi</span>
              </button>
            </div>
          </div>
        `;
        container.appendChild(shortCard);
      });
    }

    function searchVideos() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=16&q=${encodeURIComponent(query)}&type=video&key=${ADMIN_API_KEY}`)
        .then(res => res.json())
        .then(data => {
          if (data.items && data.items.length > 0) {
            const apiVids = data.items.map(item => ({
              id: item.id.videoId,
              title: item.snippet.title,
              channel: item.snippet.channelTitle,
              category: 'Hasil Cari'
            }));
            renderYoutubeGrid(apiVids);
          } else {
            filterCategory(query);
          }
        }).catch(() => {
          filterCategory(query);
        });
    }

    function filterCategory(cat) {
      if (cat === 'Semua') {
        renderYoutubeGrid(videos);
      } else {
        fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=12&q=${encodeURIComponent(cat)}&type=video&key=${ADMIN_API_KEY}`)
          .then(res => res.json())
          .then(data => {
            if (data.items) {
              const apiVids = data.items.map(item => ({
                id: item.id.videoId,
                title: item.snippet.title,
                channel: item.snippet.channelTitle,
                category: cat
              }));
              renderYoutubeGrid(apiVids);
            }
          }).catch(() => {
            const filtered = videos.filter(v => v.category.toLowerCase().includes(cat.toLowerCase()));
            renderYoutubeGrid(filtered.length ? filtered : videos);
          });
      }
    }
  </script>
</body>
        </html>
